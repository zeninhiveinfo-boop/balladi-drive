name: "Release Balladi Drive"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-osx-arm64.zip"
            rclone_folder: "rclone-v1.75.0-osx-arm64"
            rclone_bin: "src-tauri/bin/rclone-aarch64-apple-darwin"
          - platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-osx-amd64.zip"
            rclone_folder: "rclone-v1.75.0-osx-amd64"
            rclone_bin: "src-tauri/bin/rclone-x86_64-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-windows-amd64.zip"
            rclone_folder: "rclone-v1.75.0-windows-amd64"
            rclone_bin: "src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify build-runner architecture
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) test "$actual_arch" = "arm64" ;;
            x86_64-apple-darwin) test "$actual_arch" = "x86_64" ;;
            *) echo "::error::Unexpected macOS target: ${{ matrix.target }}" && exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare pinned rclone engine binary with SHA256 verification
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -sSL -O https://downloads.rclone.org/${{ matrix.rclone_ver }}/${{ matrix.rclone_zip }}
          curl -sSL -O https://downloads.rclone.org/${{ matrix.rclone_ver }}/SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check --ignore-missing SHA256SUMS
          else
            shasum -a 256 --check --ignore-missing SHA256SUMS
          fi
          unzip -q ${{ matrix.rclone_zip }}
          cp ${{ matrix.rclone_folder }}/rclone* ${{ matrix.rclone_bin }}
          chmod +x src-tauri/bin/* || true

      - name: Import Windows Authenticode Certificate and Configure Tauri
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WIN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WIN_CERT_PASSWORD)) {
            Write-Host "No Windows code signing certificate provided; continuing with standard unsigned package build."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "balladi-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WIN_CERT_BASE64)
            )
            $password = ConvertTo-SecureString `
              -String $env:WIN_CERT_PASSWORD `
              -Force `
              -AsPlainText
            $cert = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
            if (-not $cert -or [string]::IsNullOrWhiteSpace($cert.Thumbprint)) {
              throw "Certificate import did not return a valid thumbprint."
            }
            $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            if (-not $config.bundle.windows) {
              $config.bundle | Add-Member -NotePropertyName "windows" -NotePropertyValue @{}
            }
            $config.bundle.windows.certificateThumbprint = $cert.Thumbprint
            $config | ConvertTo-Json -Depth 20 | Set-Content "src-tauri/tauri.conf.json"
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Configure macOS signing and notarization credentials
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple Developer Certificate provided; continuing with standard self-contained macOS bundle build."
          else
            echo "Apple Developer Certificate detected for code signing."
          fi


      - name: Validate Managed Google OAuth build secrets
        shell: bash
        env:
          BALLADI_GOOGLE_CLIENT_ID: ${{ secrets.BALLADI_GOOGLE_CLIENT_ID }}
          BALLADI_GOOGLE_CLIENT_SECRET: ${{ secrets.BALLADI_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BALLADI_GOOGLE_CLIENT_ID:-}" ]; then
            echo "::error::BALLADI_GOOGLE_CLIENT_ID secret is required for production builds."
            exit 1
          fi
          if [ -z "${BALLADI_GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::error::BALLADI_GOOGLE_CLIENT_SECRET secret is required for production builds."
            exit 1
          fi

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BALLADI_GOOGLE_CLIENT_ID: ${{ secrets.BALLADI_GOOGLE_CLIENT_ID }}
          BALLADI_GOOGLE_CLIENT_SECRET: ${{ secrets.BALLADI_GOOGLE_CLIENT_SECRET }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Balladi Drive ${{ github.ref_name }}"
          releaseBody: "Automated production release of Balladi Drive with embedded rclone engine."
          releaseDraft: true
          prerelease: false

      - name: Verify Windows Authenticode Signatures
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" `
              -ErrorAction SilentlyContinue
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" `
              -ErrorAction SilentlyContinue
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows installer artifacts were found."
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($artifact.Name): $($signature.Status)"
            }
            Write-Host "Valid Authenticode signature: $($artifact.Name)"
          }

      - name: Verify macOS signature and notarization
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ]; then
            echo "::error::Expected macOS application and DMG were not generated"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

  publish-release:
    name: Publish verified release
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
