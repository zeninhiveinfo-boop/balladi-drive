name: "Release Balladi Drive"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v-prefixed tag to build and publish"
        required: true
        default: "v0.2.0"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-osx-arm64.zip"
            rclone_folder: "rclone-v1.75.0-osx-arm64"
            rclone_bin: "src-tauri/bin/rclone-aarch64-apple-darwin"
          - platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-osx-amd64.zip"
            rclone_folder: "rclone-v1.75.0-osx-amd64"
            rclone_bin: "src-tauri/bin/rclone-x86_64-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-windows-amd64.zip"
            rclone_folder: "rclone-v1.75.0-windows-amd64"
            rclone_bin: "src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe"

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate source version and release tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$package_version" = "$expected"
          test "$tauri_version" = "$expected"
          test "$cargo_version" = "$expected"

      - name: Validate macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) test "$actual_arch" = "arm64" ;;
            x86_64-apple-darwin) test "$actual_arch" = "x86_64" ;;
            *) echo "::error::Unexpected macOS target: ${{ matrix.target }}"; exit 1 ;;
          esac

      - name: Validate Windows runner architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected an AMD64 Windows runner, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare pinned rclone engine binary with SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin
          curl --fail --silent --show-error --location --output "${{ matrix.rclone_zip }}" \
            "https://downloads.rclone.org/${{ matrix.rclone_ver }}/${{ matrix.rclone_zip }}"
          curl --fail --silent --show-error --location --output SHA256SUMS \
            "https://downloads.rclone.org/${{ matrix.rclone_ver }}/SHA256SUMS"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check --ignore-missing SHA256SUMS
          else
            shasum -a 256 --check --ignore-missing SHA256SUMS
          fi
          unzip -q "${{ matrix.rclone_zip }}"
          if [ -f "${{ matrix.rclone_folder }}/rclone.exe" ]; then
            cp "${{ matrix.rclone_folder }}/rclone.exe" "${{ matrix.rclone_bin }}"
          else
            cp "${{ matrix.rclone_folder }}/rclone" "${{ matrix.rclone_bin }}"
          fi
          chmod +x src-tauri/bin/* || true

      - name: Run frontend tests and production build
        run: npm test && npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Run strict Rust quality checks
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Validate managed Google OAuth build secrets
        shell: bash
        env:
          BALLADI_GOOGLE_CLIENT_ID: ${{ secrets.BALLADI_GOOGLE_CLIENT_ID }}
          BALLADI_GOOGLE_CLIENT_SECRET: ${{ secrets.BALLADI_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${BALLADI_GOOGLE_CLIENT_ID:-}" || { echo "::error::BALLADI_GOOGLE_CLIENT_ID is required"; exit 1; }
          test -n "${BALLADI_GOOGLE_CLIENT_SECRET:-}" || { echo "::error::BALLADI_GOOGLE_CLIENT_SECRET is required"; exit 1; }

      - name: Build unsigned internal draft release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BALLADI_GOOGLE_CLIENT_ID: ${{ secrets.BALLADI_GOOGLE_CLIENT_ID }}
          BALLADI_GOOGLE_CLIENT_SECRET: ${{ secrets.BALLADI_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Balladi Drive ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Internal Balladi Studios release with verified high-throughput transfer telemetry.

            These installers are intentionally unsigned for manual installation on team-managed devices. macOS Gatekeeper and Windows SmartScreen may show an unverified-developer warning.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Verify macOS package, architecture, and bundled engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_dir" -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_dir" -type f -name '*.dmg' -print -quit)"
          test -n "$app_path" || { echo "::error::No macOS app bundle found"; exit 1; }
          test -n "$dmg_path" || { echo "::error::No DMG artifact found"; exit 1; }
          hdiutil verify "$dmg_path"

          app_binary="$(find "$app_path/Contents/MacOS" -type f -perm -111 ! -name 'rclone*' -print -quit)"
          rclone_binary="$(find "$app_path/Contents/MacOS" -type f -perm -111 -name 'rclone*' -print -quit)"
          test -n "$app_binary" || { echo "::error::No application executable found"; exit 1; }
          test -n "$rclone_binary" || { echo "::error::No bundled rclone executable found"; exit 1; }

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              file "$app_binary" | grep -q 'arm64'
              file "$rclone_binary" | grep -q 'arm64'
              ;;
            x86_64-apple-darwin)
              file "$app_binary" | grep -q 'x86_64'
              file "$rclone_binary" | grep -q 'x86_64'
              ;;
          esac
          "$rclone_binary" version | grep -q 'rclone v1.75.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")" = "0.2.0"

      - name: Verify Windows packages and bundled engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $artifacts = @(
            Get-ChildItem "$bundleDir/nsis" -Filter *.exe -File -ErrorAction SilentlyContinue
            Get-ChildItem "$bundleDir/msi" -Filter *.msi -File -ErrorAction SilentlyContinue
          )
          if ($artifacts.Count -eq 0) { throw "No Windows EXE or MSI artifacts were produced" }
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -le 0) { throw "Empty Windows installer: $($artifact.FullName)" }
          }
          $rclone = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release" -Filter rclone*.exe -File | Select-Object -First 1
          if ($null -eq $rclone) { throw "No bundled Windows rclone executable found" }
          $rcloneVersion = & $rclone.FullName version
          if (($rcloneVersion -join "`n") -notmatch "rclone v1\.75\.0") { throw "Unexpected bundled rclone version" }

  publish-release:
    name: Publish verified release
    needs: build-and-release
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Publish draft only after every platform passes
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release edit "$RELEASE_TAG" --draft=false --latest
