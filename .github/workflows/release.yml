name: "Release Balladi Drive"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-osx-arm64.zip"
            rclone_folder: "rclone-v1.75.0-osx-arm64"
            rclone_bin: "src-tauri/bin/rclone-aarch64-apple-darwin"
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-osx-amd64.zip"
            rclone_folder: "rclone-v1.75.0-osx-amd64"
            rclone_bin: "src-tauri/bin/rclone-x86_64-apple-darwin"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            rclone_ver: "v1.75.0"
            rclone_zip: "rclone-v1.75.0-windows-amd64.zip"
            rclone_folder: "rclone-v1.75.0-windows-amd64"
            rclone_bin: "src-tauri/bin/rclone-x86_64-pc-windows-msvc.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare pinned rclone engine binary with SHA256 verification
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -sSL -O https://downloads.rclone.org/${{ matrix.rclone_ver }}/${{ matrix.rclone_zip }}
          curl -sSL -O https://downloads.rclone.org/${{ matrix.rclone_ver }}/SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check --ignore-missing SHA256SUMS
          else
            shasum -a 256 --check --ignore-missing SHA256SUMS
          fi
          unzip -q ${{ matrix.rclone_zip }}
          if [ -f "${{ matrix.rclone_folder }}/rclone.exe" ]; then
            cp "${{ matrix.rclone_folder }}/rclone.exe" "${{ matrix.rclone_bin }}"
          else
            cp "${{ matrix.rclone_folder }}/rclone" "${{ matrix.rclone_bin }}"
          fi
          chmod +x src-tauri/bin/* || true

      - name: Validate Managed Google OAuth build secrets
        shell: bash
        env:
          BALLADI_GOOGLE_CLIENT_ID: ${{ secrets.BALLADI_GOOGLE_CLIENT_ID }}
          BALLADI_GOOGLE_CLIENT_SECRET: ${{ secrets.BALLADI_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BALLADI_GOOGLE_CLIENT_ID:-}" ]; then
            echo "::error::BALLADI_GOOGLE_CLIENT_ID secret is required for production builds."
            exit 1
          fi
          if [ -z "${BALLADI_GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::error::BALLADI_GOOGLE_CLIENT_SECRET secret is required for production builds."
            exit 1
          fi

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BALLADI_GOOGLE_CLIENT_ID: ${{ secrets.BALLADI_GOOGLE_CLIENT_ID }}
          BALLADI_GOOGLE_CLIENT_SECRET: ${{ secrets.BALLADI_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Balladi Drive ${{ github.ref_name }}"
          releaseBody: "Automated production release of Balladi Drive media transfer engine."
          releaseDraft: false
          prerelease: false

