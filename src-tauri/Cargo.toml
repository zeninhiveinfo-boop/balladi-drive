[package]
name = "balladi-drive"
version = "0.2.0"
description = "Balladi Drive - High Reliability Google Drive Media Transfer"
authors = ["Balladi Studios"]
edition = "2021"

[lib]
name = "balladi_drive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.33"
rand = "0.8"
open = "5.3"
regex = "1"
dirs = "6.0"
md-5 = "0.10"
sha2 = "0.10"


